name: Secret scan
# Backstop for edits made on github.com or with the hook turned off: fails if a secret, key file, state file or CSV export is in the tree.
on:
  push:
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/secret_scan.py --all
